name: rubric-scale-standardizer
version: 1.0.0
description: "Generates 4-tier rubric grading criteria scale for assignment evaluation"
input_schema:
  type: object
  properties:
    objective_text:
      type: string
      description: "Target learning objective"
  required:
    - objective_text
implementation:
  type: script
  path: rubric_scale_standardizer.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
