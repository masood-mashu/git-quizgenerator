name: distractor-quality-evaluator
version: 1.0.0
description: "Verifies that multiple choice distractors are grammatically parallel and plausible"
input_schema:
  type: object
  properties:
    distractors_json:
      type: string
      description: "JSON list of distractor option strings"
  required:
    - distractors_json
implementation:
  type: script
  path: distractor_quality_evaluator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
