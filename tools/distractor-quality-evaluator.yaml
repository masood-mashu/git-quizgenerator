name: "distractor-quality-evaluator"
description: "Verifies that multiple choice distractors are grammatically parallel and plausible"
version: "0.1.0"
runtime:
  language: "python"
  entrypoint: "distractor_quality_evaluator.py"
parameters:
  type: "object"
  properties:
    distractors_json:
      type: "string"
      description: "JSON list of distractor option strings"
  required:
    - "distractors_json"
