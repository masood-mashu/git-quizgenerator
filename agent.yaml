spec_version: "0.1.0"
name: git-quizgenerator
version: 1.0.0
description: "Autonomous Bloom's Taxonomy Assessment Builder, Distractor Quality Evaluator & Rubric Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - blooms-taxonomy-assessment
  - item-response-theory

tools:
  - blooms-taxonomy-tagger
  - distractor-quality-evaluator
  - rubric-scale-standardizer

runtime:
  max_turns: 50
  timeout: 120

tags:
  - education
  - quiz-generator
  - blooms-taxonomy
  - assessment-design
  - passport-challenge

metadata:
  passport_id: "aps-quizgenerator-01"
  passport_category: "Education"
